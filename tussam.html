<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TUSSAM+</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<style>
:root {
  --rojo: #E8431A; --rojo2: #BF3010; --negro: #111;
  --fondo: #F4EFE9; --blanc: #FDFAF7;
  --g1: #E8E3DD; --g2: #B0A89E; --g3: #6E665E;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: #222; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input  { font-family: inherit; }

/* Shell */
.app {
  display: flex; flex-direction: column;
  width: 100%; max-width: 480px;
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  height: 100%; height: 100dvh;
  background: var(--blanc);
  box-shadow: 0 0 80px rgba(0,0,0,.4);
  overflow: hidden;
}

/* Header */
header {
  flex-shrink: 0; background: var(--rojo); padding: 13px 18px 11px;
  position: relative; overflow: hidden;
}
header::after {
  content: 'TUSSAM'; position: absolute; right: -8px; top: -6px;
  font-family: 'Bebas Neue', sans-serif; font-size: 68px;
  color: rgba(255,255,255,.07); pointer-events: none;
}
.logo { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: #fff; line-height: 1; }
.logo span { color: rgba(255,255,255,.4); }
.hrow { display: flex; justify-content: space-between; align-items: flex-end; }
.hcount { font-size: 11px; color: rgba(255,255,255,.55); text-align: right; line-height: 1.4; }

/* Nav */
nav {
  flex-shrink: 0; display: flex; background: var(--negro);
  position: relative; z-index: 10;
}
nav button {
  flex: 1; padding: 9px 4px 7px; color: var(--g2);
  font-size: 10px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
nav button .ico { font-size: 17px; line-height: 1; }
nav button.active { color: var(--rojo); border-bottom-color: var(--rojo); }
nav button:hover:not(.active) { color: #fff; }

/* Screens container */
#screens {
  flex: 1; min-height: 0; position: relative;
}

/* All screens: hidden with visibility so they keep dimensions */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  visibility: hidden; pointer-events: none;
  background: var(--blanc);
}
.screen.active { visibility: visible; pointer-events: all; z-index: 1; }

/* Map screen: horizontal layout */
#screen-mapa { flex-direction: row; }

/* Map div */
#map { flex: 1; min-width: 0; min-height: 0; }

/* Line filter panel */
.lpanel {
  width: 58px; flex-shrink: 0;
  background: var(--blanc); border-left: 1px solid var(--g1);
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; overflow-x: hidden;
  padding: 6px 5px 10px;
  transition: width .22s ease, padding .22s ease;
}
.lpanel.oculto { width: 0; padding: 0; overflow: hidden; }
.lpanel::-webkit-scrollbar { width: 3px; }
.lpanel::-webkit-scrollbar-thumb { background: var(--g1); border-radius: 2px; }

/* Panel toggle button */
.ptoggle {
  position: absolute; top: 50%; right: 0; transform: translateY(-50%);
  width: 18px; height: 48px;
  background: var(--blanc); border: 1px solid var(--g1);
  border-right: none; border-radius: 6px 0 0 6px;
  cursor: pointer; z-index: 5; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  color: var(--g3);
}
.ptoggle:hover { background: var(--fondo); }

/* Line chips */
.plabel {
  font-size: 8px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; color: var(--g2);
  text-align: center; padding: 2px 0; flex-shrink: 0;
}
.ptodas {
  width: 48px; height: 26px; border-radius: 6px;
  font-size: 9px; font-weight: 700;
  background: var(--rojo); color: #fff;
  border: none; cursor: pointer; flex-shrink: 0;
  transition: background .15s;
}
.ptodas.off { background: var(--g1); color: var(--g3); }
.lchip {
  width: 48px; height: 30px; border-radius: 6px;
  font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; color: #fff; flex-shrink: 0;
  opacity: .25; transition: opacity .15s, transform .1s;
}
.lchip.on { opacity: 1; }
.lchip:hover { opacity: .7; }
.lchip.on:hover { opacity: .85; }

/* Search */
.sbar { flex-shrink: 0; padding: 11px 14px 8px; border-bottom: 1px solid var(--g1); }
.swrap { position: relative; }
.swrap input {
  width: 100%; padding: 9px 36px 9px 36px;
  border: 1.5px solid var(--g1); border-radius: 8px;
  font-size: 14px; background: var(--fondo); outline: none;
  transition: border-color .15s; -webkit-appearance: none;
}
.swrap input:focus { border-color: var(--rojo); background: var(--blanc); }
.si { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--g2); pointer-events: none; }
.sc {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  font-size: 13px; color: var(--g2);
}
.swrap.v .sc { display: flex; }

/* List */
.list { flex: 1; overflow-y: auto; padding: 4px 0; }
.list::-webkit-scrollbar { width: 3px; }
.list::-webkit-scrollbar-thumb { background: var(--g1); border-radius: 2px; }

/* Parada row */
.prow {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--g1);
  cursor: pointer; transition: background .12s;
  -webkit-tap-highlight-color: transparent;
}
.prow:active { background: var(--fondo); }
.pbadge {
  min-width: 44px; height: 34px; padding: 0 5px;
  border-radius: 7px; background: var(--rojo); color: #fff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.pinfo { flex: 1; min-width: 0; }
.pnombre { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plineas { font-size: 11px; color: var(--g3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pstar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.pstar:active { background: var(--g1); }

/* Empty state */
.empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; color: var(--g2); padding: 32px 20px; text-align: center;
}
.empty .big { font-size: 44px; opacity: .4; }
.empty p { font-size: 13px; line-height: 1.5; }

/* Section header */
.shdr { flex-shrink: 0; padding: 12px 16px 10px; border-bottom: 1px solid var(--g1); }
.stitle { font-family: 'Bebas Neue', sans-serif; font-size: 22px; }
.ssub { font-size: 11px; color: var(--g2); margin-top: 1px; }
.bloc {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px;
  background: var(--rojo); color: #fff;
  font-size: 13px; font-weight: 600; margin-top: 8px;
  border: none; cursor: pointer;
}
.bloc:active { background: var(--rojo2); }

/* Drawer */
.overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.32);
  z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.drawer {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 51;
  background: var(--blanc); border-radius: 18px 18px 0 0;
  padding-bottom: 28px;
  transform: translateY(102%);
  transition: transform .26s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 -6px 32px rgba(0,0,0,.13);
  max-height: 85%; overflow-y: auto;
}
.drawer.open { transform: none; }
.dhandle { width: 36px; height: 4px; background: var(--g1); border-radius: 2px; margin: 12px auto 14px; }
.dbody { padding: 0 18px; }
.dnombre { font-family: 'Bebas Neue', sans-serif; font-size: 26px; line-height: 1.1; }
.did { font-size: 12px; color: var(--g2); margin-top: 2px; }
.dsec { margin-top: 16px; }
.dlabel { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--g2); margin-bottom: 7px; }
.lbtns { display: flex; flex-wrap: wrap; gap: 7px; }
.lbtn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 11px; border-radius: 8px;
  font-size: 12px; font-weight: 700; text-decoration: none;
  color: #fff; transition: filter .15s;
}
.lbtn:active { filter: brightness(.85); }
.lbtn .ln { font-size: 13px; }
.lbtn .ld { font-size: 10px; opacity: .85; font-weight: 500; max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.favbig {
  width: 100%; margin-top: 14px; padding: 11px;
  border-radius: 10px; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--fondo); color: var(--negro);
  border: 1.5px solid var(--g1); transition: all .15s;
}
.favbig.on { background: #FFF3F0; border-color: var(--rojo); color: var(--rojo); }

/* Loader */
.loader { width: 26px; height: 26px; border: 3px solid var(--g1); border-top-color: var(--rojo); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
  position: absolute; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(50px);
  background: var(--negro); color: #fff;
  padding: 9px 18px; border-radius: 20px;
  font-size: 12px; font-weight: 500; z-index: 100;
  white-space: nowrap; pointer-events: none;
  transition: transform .22s, opacity .22s; opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

@media (min-width: 481px) {
  .app { border-radius: 22px; top: 50%; transform: translate(-50%, -50%); height: calc(100dvh - 32px); }
}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="hrow">
      <div class="logo">TUSSAM<span>+</span></div>
      <div class="hcount" id="hcount"></div>
    </div>
  </header>

  <nav>
    <button class="active" onclick="goTo('buscar',this)"><span class="ico">🔍</span>Buscar</button>
    <button onclick="goTo('mapa',this)"><span class="ico">🗺️</span>Mapa</button>
    <button onclick="goTo('cercanas',this)"><span class="ico">📍</span>Cercanas</button>
    <button onclick="goTo('favoritos',this)"><span class="ico">⭐</span>Favoritos</button>
  </nav>

  <div id="screens">

    <!-- BUSCAR -->
    <div class="screen active" id="screen-buscar">
      <div class="sbar">
        <div class="swrap" id="sw">
          <span class="si">🔍</span>
          <input id="q" type="search" placeholder="Parada, número o línea..."
                 autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="sc" onclick="clearQ()">✕</button>
        </div>
      </div>
      <div class="list" id="list-buscar"></div>
    </div>

    <!-- MAPA -->
    <div class="screen" id="screen-mapa">
      <div id="map">
        <button class="ptoggle" id="ptoggle" onclick="togglePanel()">☰</button>
      </div>
      <div class="lpanel" id="lpanel">
        <div class="plabel">Líneas</div>
        <button class="ptodas" id="btn-todas" onclick="filtrarTodas()">Todas</button>
      </div>
    </div>

    <!-- CERCANAS -->
    <div class="screen" id="screen-cercanas">
      <div class="shdr">
        <div class="stitle">Cercanas</div>
        <div class="ssub">Paradas en un radio de ~500m</div>
        <button class="bloc" onclick="buscarCercanas()">📍 Usar mi ubicación</button>
      </div>
      <div class="list" id="list-cercanas">
        <div class="empty"><span class="big">📍</span><p>Pulsa el botón para ver paradas cercanas</p></div>
      </div>
    </div>

    <!-- FAVORITOS -->
    <div class="screen" id="screen-favoritos">
      <div class="shdr">
        <div class="stitle">Favoritos</div>
        <div class="ssub">Tus paradas guardadas</div>
      </div>
      <div class="list" id="list-favoritos"></div>
    </div>

    <!-- Overlay + Drawer -->
    <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
      <div class="dhandle"></div>
      <div class="dbody">
        <div class="dnombre" id="dnombre"></div>
        <div class="did" id="did"></div>
        <div class="dsec">
          <div class="dlabel">Líneas que paran aquí</div>
          <div class="lbtns" id="dlbtns"></div>
        </div>
        <button class="favbig" id="favbig" onclick="toggleFavDrawer()">
          <span id="favico">☆</span>
          <span id="favtxt">Guardar como favorita</span>
        </button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div><!-- /screens -->
</div><!-- /app -->

var FAV_KEY = 'tussam_favs_v3';
var st = {
  paradas:  [],
  lineas:   [],
  favs:     new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')),
  drawerP:  null,
  map:      null,
  allLayer: null,
  selLayer: null,
  markers:  {}
};
var selLineas = new Set();
var colorMap  = {};

// ── Init ────────────────────────────────────────────────────────────────────
(function init() {
  // Normalizar paradas
  st.paradas = PARADAS.map(function(p) {
    var arr = Array.isArray(p.lineas) ? p.lineas : (p.lineas ? p.lineas.split(', ') : []);
    return {
      stopId:    String(p.id || p.stopId || ''),
      nombre:    p.nombre || '',
      lat:       p.lat,
      lon:       p.lon,
      lineasArr: arr,
      lineas:    arr.join(', ')
    };
  });
  st.lineas = LINEAS;

  LINEAS.forEach(function(l) { colorMap[l.nombre] = l.color; });

  document.getElementById('hcount').innerHTML = st.paradas.length.toLocaleString() + '<br>paradas';
  renderLista(st.paradas, 'list-buscar');

  // Mapa: init ahora mismo — visibility:hidden mantiene dimensiones reales
  initMapa();
})();

// ── Navegación ──────────────────────────────────────────────────────────────
function goTo(id, btn) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('nav button').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('screen-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
  if (id === 'mapa'      && st.map) { setTimeout(function() { st.map.invalidateSize(); }, 50); }
  if (id === 'favoritos') renderFavoritos();
}

// ── Render lista ────────────────────────────────────────────────────────────
function renderLista(paradas, cid, lim) {
  var el  = document.getElementById(cid);
  if (!paradas.length) {
    el.innerHTML = '<div class="empty"><span class="big">🚏</span><p>Sin resultados</p></div>';
    return;
  }
  var max  = lim !== undefined ? lim : Math.min(paradas.length, 200);
  var frag = document.createDocumentFragment();
  paradas.slice(0, max).forEach(function(p) { frag.appendChild(makeRow(p)); });
  el.innerHTML = '';
  el.appendChild(frag);
  if (paradas.length > max) {
    var m = document.createElement('div');
    m.className = 'empty';
    m.innerHTML = '<p>Mostrando ' + max + ' de ' + paradas.length + '. Filtra para ver más.</p>';
    el.appendChild(m);
  }
}

function makeRow(p) {
  var div = document.createElement('div');
  div.className = 'prow';
  var on = st.favs.has(p.stopId);
  div.innerHTML =
    '<div class="pbadge">' + esc(p.stopId) + '</div>' +
    '<div class="pinfo">' +
      '<div class="pnombre">' + esc(p.nombre || 'Sin nombre') + '</div>' +
      '<div class="plineas">' + esc(p.lineas || 'Sin líneas') + '</div>' +
    '</div>' +
    '<button class="pstar" data-id="' + esc(p.stopId) + '">' + (on ? '⭐' : '☆') + '</button>';

  div.querySelector('.pstar').addEventListener('click', function(e) {
    e.stopPropagation();
    toggleFav(p.stopId);
  });
  div.addEventListener('click', function(e) {
    if (!e.target.closest('.pstar')) openDrawer(p);
  });
  return div;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Búsqueda ────────────────────────────────────────────────────────────────
var searchTimer;
document.getElementById('q').addEventListener('input', function(e) {
  document.getElementById('sw').classList.toggle('v', e.target.value.length > 0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    var v = e.target.value.trim().toLowerCase();
    if (!v) { renderLista(st.paradas, 'list-buscar'); return; }
    var r = st.paradas.filter(function(p) {
      return p.nombre.toLowerCase().includes(v) ||
             p.stopId.includes(v) ||
             p.lineas.toLowerCase().includes(v);
    });
    renderLista(r, 'list-buscar', r.length);
  }, 200);
});

function clearQ() {
  document.getElementById('q').value = '';
  document.getElementById('sw').classList.remove('v');
  renderLista(st.paradas, 'list-buscar');
}

// ── Mapa (Leaflet) ──────────────────────────────────────────────────────────
function initMapa() {
  if (st.map) return;

  var map = L.map('map', {
    center: [37.3891, -5.9845],
    zoom: 13,
    preferCanvas: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  st.map = map;

  // Estilos de cluster personalizados (color TUSSAM)
  var clusterOpts = {
    maxClusterRadius: 50,
    iconCreateFunction: function(cluster) {
      var n = cluster.getChildCount();
      var size = n < 10 ? 32 : n < 50 ? 38 : 44;
      var bg   = n < 10 ? '#E8431A' : n < 50 ? '#BF3010' : '#8B1A00';
      return L.divIcon({
        html: '<div style="width:'+size+'px;height:'+size+'px;background:'+bg+';border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+n+'</div>',
        className: '', iconSize: [size, size], iconAnchor: [size/2, size/2]
      });
    }
  };

  var icon = L.divIcon({
    className: '',
    html: '<div style="width:9px;height:9px;background:#E8431A;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>',
    iconSize: [9, 9], iconAnchor: [4, 4]
  });

  // Cluster group para todas las paradas
  st.allLayer = L.markerClusterGroup(clusterOpts);
  st.selLayer = L.markerClusterGroup(clusterOpts);

  st.paradas.forEach(function(p) {
    var m = L.marker([p.lat, p.lon], { icon: icon })
      .on('click', function() { openDrawer(p); });
    st.markers[p.stopId] = m;
    st.allLayer.addLayer(m);
  });

  st.allLayer.addTo(map);

  buildLinePanel();
}

function buildLinePanel() {
  var panel = document.getElementById('lpanel');
  panel.querySelectorAll('.lchip').forEach(function(e) { e.remove(); });
  st.lineas.forEach(function(l) {
    var btn = document.createElement('button');
    btn.className = 'lchip';
    btn.textContent = l.nombre;
    btn.style.background = l.color;
    btn.title = l.desc || l.nombre;
    btn.addEventListener('click', function() { toggleLinea(l.nombre, btn); });
    panel.appendChild(btn);
  });
}

function toggleLinea(nombre, btn) {
  if (selLineas.has(nombre)) { selLineas.delete(nombre); btn.classList.remove('on'); }
  else                       { selLineas.add(nombre);    btn.classList.add('on');    }
  document.getElementById('btn-todas').classList.toggle('off', selLineas.size > 0);
  updateMapMarkers();
}

function filtrarTodas() {
  selLineas.clear();
  document.querySelectorAll('.lchip').forEach(function(b) { b.classList.remove('on'); });
  document.getElementById('btn-todas').classList.remove('off');
  updateMapMarkers();
}

function togglePanel() {
  var panel = document.getElementById('lpanel');
  var btn   = document.getElementById('ptoggle');
  panel.classList.toggle('oculto');
  btn.textContent = panel.classList.contains('oculto') ? '☰' : '✕';
  setTimeout(function() { if (st.map) st.map.invalidateSize(); }, 230);
}

function updateMapMarkers() {
  if (!st.map) return;

  if (st.map.hasLayer(st.allLayer)) st.map.removeLayer(st.allLayer);
  if (st.map.hasLayer(st.selLayer)) st.map.removeLayer(st.selLayer);

  if (selLineas.size === 0) {
    st.map.addLayer(st.allLayer);
    return;
  }

  // Filtrar por líneas seleccionadas con cluster coloreado
  st.selLayer.clearLayers();
  st.paradas.forEach(function(p) {
    if (!p.lineasArr.some(function(l) { return selLineas.has(l); })) return;
    var matchLine = p.lineasArr.find(function(l) { return selLineas.has(l); });
    var color = colorMap[matchLine] || '#E8431A';
    var ic = L.divIcon({
      className: '',
      html: '<div style="width:9px;height:9px;background:' + color + ';border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>',
      iconSize: [9, 9], iconAnchor: [4, 4]
    });
    L.marker([p.lat, p.lon], { icon: ic })
      .on('click', function() { openDrawer(p); })
      .addTo(st.selLayer);
  });

  // Actualizar color de clusters del selLayer según línea activa
  var selColor = '#E8431A';
  if (selLineas.size === 1) {
    selLineas.forEach(function(l) { selColor = colorMap[l] || selColor; });
  }
  st.selLayer.options.iconCreateFunction = function(cluster) {
    var n = cluster.getChildCount();
    var size = n < 10 ? 32 : n < 50 ? 38 : 44;
    var bg   = n < 10 ? selColor : n < 50 ? selColor : selColor;
    return L.divIcon({
      html: '<div style="width:'+size+'px;height:'+size+'px;background:'+bg+';border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+n+'</div>',
      className: '', iconSize: [size, size], iconAnchor: [size/2, size/2]
    });
  };

  st.map.addLayer(st.selLayer);
}

// ── Cercanas ────────────────────────────────────────────────────────────────
function buscarCercanas() {
  var el = document.getElementById('list-cercanas');

  if (!navigator.geolocation) {
    el.innerHTML = '<div class="empty"><span class="big">⚠️</span><p>Tu navegador no soporta geolocalización</p></div>';
    return;
  }

  el.innerHTML = '<div class="empty"><div class="loader"></div><p>Obteniendo ubicación...</p></div>';

  function mostrarParadas(lat, lon) {
    var R   = 0.0045; // ~500m
    var res = st.paradas
      .filter(function(p) { return Math.abs(p.lat - lat) < R && Math.abs(p.lon - lon) < R; })
      .sort(function(a, b) {
        return Math.hypot(a.lat - lat, a.lon - lon) - Math.hypot(b.lat - lat, b.lon - lon);
      })
      .slice(0, 50);
    if (!res.length) {
      el.innerHTML = '<div class="empty"><span class="big">😶</span><p>No hay paradas TUSSAM a menos de 500m</p></div>';
      return;
    }
    renderLista(res, 'list-cercanas', 50);
  }

  function onError(err) {
    var msg = 'No se pudo obtener la ubicación';
    if (err.code === 1) msg = 'Permiso denegado. Activa la ubicación en tu navegador.';
    if (err.code === 2) msg = 'Posición no disponible. Asegúrate de tener GPS activo.';
    if (err.code === 3) msg = 'Tiempo agotado. Inténtalo de nuevo.';
    el.innerHTML = '<div class="empty"><span class="big">📍</span><p>' + msg + '</p>' +
      '<button class="bloc" onclick="buscarCercanas()" style="margin-top:12px">🔄 Reintentar</button></div>';
  }

  // Intento 1: rápido usando caché (hasta 60s) — funciona aunque el GPS tarde
  navigator.geolocation.getCurrentPosition(
    function(pos) { mostrarParadas(pos.coords.latitude, pos.coords.longitude); },
    function() {
      // Intento 2: sin caché, alta precisión, más tiempo
      navigator.geolocation.getCurrentPosition(
        function(pos) { mostrarParadas(pos.coords.latitude, pos.coords.longitude); },
        onError,
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
      );
    },
    { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
  );
}

// ── Favoritos ───────────────────────────────────────────────────────────────
function toggleFav(stopId) {
  var was = st.favs.has(stopId);
  if (was) st.favs.delete(stopId);
  else     st.favs.add(stopId);
  localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(st.favs)));
  showToast(was ? 'Eliminada de favoritos' : '⭐ Añadida a favoritos');
  document.querySelectorAll('.pstar[data-id="' + stopId + '"]').forEach(function(b) {
    b.textContent = st.favs.has(stopId) ? '⭐' : '☆';
  });
  if (st.drawerP && st.drawerP.stopId === stopId) refreshFavBtn();
}

function renderFavoritos() {
  var el    = document.getElementById('list-favoritos');
  var favP  = Array.from(st.favs)
    .map(function(id) { return st.paradas.find(function(p) { return p.stopId === id; }); })
    .filter(Boolean);
  if (!favP.length) {
    el.innerHTML = '<div class="empty"><span class="big">☆</span><p>Aún no tienes favoritos.<br>Pulsa ☆ en cualquier parada para guardarla.</p></div>';
    return;
  }
  renderLista(favP, 'list-favoritos', favP.length);
}

// ── Drawer ───────────────────────────────────────────────────────────────────
function openDrawer(p) {
  st.drawerP = p;
  document.getElementById('dnombre').textContent = p.nombre || 'Sin nombre';
  document.getElementById('did').textContent = 'Parada · ID ' + p.stopId;

  var el = document.getElementById('dlbtns');
  el.innerHTML = '';
  if (p.lineasArr && p.lineasArr.length) {
    p.lineasArr.forEach(function(nom) {
      var lin   = st.lineas.find(function(l) { return l.nombre === nom || l.nombre === nom.padStart(2,'0'); });
      var color = lin ? lin.color : '#444';
      var desc  = lin ? lin.desc  : '';
      var a     = document.createElement('a');
      a.href    = 'https://reddelineas.tussam.es/?linea=' + encodeURIComponent(nom) + '&lang=es';
      a.target  = '_blank';
      a.rel     = 'noopener';
      a.className = 'lbtn';
      a.style.background = color;
      a.innerHTML = '<span class="ln">' + esc(nom) + '</span>' +
                    (desc ? '<span class="ld">' + esc(desc) + '</span>' : '');
      el.appendChild(a);
    });
  } else {
    el.innerHTML = '<span style="font-size:12px;color:var(--g2)">Sin líneas registradas</span>';
  }

  refreshFavBtn();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  st.drawerP = null;
}

function refreshFavBtn() {
  var p  = st.drawerP;
  if (!p) return;
  var on = st.favs.has(p.stopId);
  document.getElementById('favico').textContent = on ? '⭐' : '☆';
  document.getElementById('favtxt').textContent = on ? 'Quitar de favoritos' : 'Guardar como favorita';
  document.getElementById('favbig').classList.toggle('on', on);
}

function toggleFavDrawer() {
  if (st.drawerP) toggleFav(st.drawerP.stopId);
}

// ── Toast ────────────────────────────────────────────────────────────────────
var toastTimer;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2200);
}
</script>
